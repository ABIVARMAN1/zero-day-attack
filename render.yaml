services:
  # ─── Backend: Flask Web Service ──────────────────────────────────────────────
  - type: web
    name: zero-day-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gthread --threads=2 --workers=1 --bind=0.0.0.0:$PORT --timeout=120 "backend.app:app"
    plan: free
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false   # Set manually in Render dashboard (contains credentials)
      - key: FRONTEND_URL
        value: https://zero-day-attack.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://zero-day-attack.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true
